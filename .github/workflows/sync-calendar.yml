name: Sync Calendar

on:
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Create credentials file
        run: printf '%s\n' "$GOOGLE_CREDENTIALS" > credentials_mw.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.CREDENTIALS_MW_JSON }}
      - name: Sync schedule to Google Calendar
        run: uv run --frozen --no-dev miho-watanabe-calendar
        env:
          CALENDAR_ID_MW: ${{ secrets.CALENDAR_ID_MW }}
      - name: Remove credentials file
        if: always()
        run: rm -f credentials_mw.json
