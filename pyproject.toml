[project]
name = "miho-watanabe-calendar"
version = "0.1.0"
description = "渡邉美穂さんのスケジュールをGoogleカレンダーへ自動登録する"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "google-api-python-client>=2.187.0",
    "google-auth-httplib2>=0.2.1",
    "google-auth-oauthlib>=1.2.3",
    "jaconv>=0.4.0",
    "lxml>=6.0.2",
    "python-dateutil>=2.9.0",
    "requests>=2.32.5",
    "tendo>=0.3.0",
]

[project.scripts]
miho-watanabe-calendar = "miho_watanabe_calendar.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
